name: Build and Deploy

# Same workflow in rzv-api, rzv-client, rzv-pro and rzv-admin — only APP_NAME and the
# build-args differ. Web addresses are baked in at build time, so each environment
# gets its own image.

on:
  push:
    branches: [main, production]

env:
  REGISTRY: ghcr.io
  APP_NAME: rzv-client
  # Two environments from one workflow (2026-10-13):
  #   main       → the team preview  rzv.wisecode.tn  (~/apps/rezervy,      image :latest)
  #   production → rezervy.io                          (~/apps/rezervy-prod, image :prod)
  # Promote to production = merge main into the production branch and push it.
  IMAGE_TAG: ${{ github.ref_name == 'production' && 'prod' || 'latest' }}
  DEPLOY_DIR: ${{ github.ref_name == 'production' && 'rezervy-prod' || 'rezervy' }}
  API_ORIGIN: ${{ github.ref_name == 'production' && 'https://api.rezervy.io' || 'https://rzv-api.wisecode.tn' }}
  SITE_ORIGIN: ${{ github.ref_name == 'production' && 'https://rezervy.io' || 'https://rzv.wisecode.tn' }}
  PRO_ORIGIN: ${{ github.ref_name == 'production' && 'https://pro.rezervy.io' || 'https://rzv-pro.wisecode.tn' }}

jobs:
  # Lint + tests first: a failing check stops the image from being built and
  # deployed (see client/tests and eslint.config.mjs).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/wisecodetn/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/wisecodetn/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_ORIGIN }}
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_ORIGIN }}
            NEXT_PUBLIC_MEDIA_URL=${{ env.API_ORIGIN }}
            NEXT_PUBLIC_PRO_URL=${{ env.PRO_ORIGIN }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=476575411657-acpd5uo0qmmir900im1ua81a18nsk90o.apps.googleusercontent.com
            API_URL=${{ env.API_ORIGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/apps/${{ env.DEPLOY_DIR }}
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u wisecodetn --password-stdin
            docker compose pull ${{ env.APP_NAME }}
            docker compose up -d ${{ env.APP_NAME }}
            docker image prune -f